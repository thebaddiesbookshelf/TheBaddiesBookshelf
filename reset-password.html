
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | The Baddies Bookshelf</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme:dark;
      --pink:#ff39b0;
      --bg:#100913;
      --muted:#c5afc2;
    }
    * {box-sizing:border-box}
    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(ellipse at 20% 10%,#542044,transparent 40%),
        radial-gradient(ellipse at 90% 90%,#3e1540,transparent 40%),
        var(--bg);
      color:white;
      font-family:'DM Sans',sans-serif;
    }
    header {
      padding:20px clamp(20px,6vw,90px);
      border-bottom:1px solid #ffffff18;
    }
    header a {
      color:white;
      text-decoration:none;
      font-family:'Bebas Neue',sans-serif;
      font-size:27px;
    }
    header span {color:var(--pink)}
    main {
      min-height:calc(100vh - 85px);
      display:grid;
      place-items:center;
      padding:30px 16px;
    }
    .card {
      width:min(100%,500px);
      padding:clamp(24px,5vw,42px);
      background:#1b1021;
      border:1px solid #f787d05c;
      border-radius:26px;
      box-shadow:0 20px 75px #0008;
      text-align:center;
    }
    .kicker {
      color:var(--pink);
      letter-spacing:3px;
      font-size:12px;
      font-weight:800;
    }
    h1 {
      font:700 clamp(30px,6vw,43px) 'Playfair Display',serif;
    }
    h1 em {color:var(--pink);font-style:normal}
    p {color:var(--muted);line-height:1.7}
    label {
      display:block;
      text-align:left;
      margin:18px 0 8px;
      font-weight:700;
    }
    input {
      width:100%;
      padding:15px;
      background:#120b17;
      border:1px solid #76516f;
      border-radius:12px;
      color:white;
      font:inherit;
    }
    input:focus {
      outline:2px solid var(--pink);
      outline-offset:2px;
    }
    button {
      width:100%;
      padding:15px;
      margin-top:20px;
      border:0;
      border-radius:12px;
      background:linear-gradient(110deg,#ff229e,#f35bbb);
      color:white;
      font:800 15px 'DM Sans',sans-serif;
      cursor:pointer;
    }
    button:disabled {opacity:.6}
    #message {margin-top:20px;line-height:1.7}
    .links {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px 24px;
      margin-top:28px;
    }
    a {color:#ff90d0;font-weight:700}
    [hidden] {display:none!important}
  </style>
</head>
<body>
  <header>
    <a href="home.html">
      THE BADDIES <span>BOOKSHELF</span> ♕
    </a>
  </header>

  <main>
    <section class="card">
      <div class="kicker">✦ BADDIE ACCOUNT RECOVERY ✦</div>
      <h1>New Password, <em>New Era.</em> 💋</h1>
      <p>
        Your bookshelf is waiting!
        Create a new password to regain access
        to your existing TBB account.
      </p>

      <form id="passwordForm" hidden>
        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Repeat your new password"
          required
        >

        <button id="saveButton" type="submit">
          🔐 Save My New Password
        </button>
      </form>

      <p id="message" role="status" aria-live="polite">
        💌 Verifying your recovery link...
      </p>

      <div class="links">
        <a href="forgot-password.html">
          💌 Request Another Link
        </a>
        <a href="home.html">🏠 TBB Home</a>
        <a href="login.html">🔐 Member Login</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://rmfmdetdykwfxxfzamhj.supabase.co',
      'sb_publishable_6UBKZvkvkyPNACqDDNRjNQ_wlgy-Jr2',
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true
        }
      }
    );

    const form = document.getElementById('passwordForm');
    const message = document.getElementById('message');
    const button = document.getElementById('saveButton');

    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.slice(1));

    let recoveryVerified = false;
    let completed = false;

    function unlock() {
      if (completed) return;
      recoveryVerified = true;
      form.hidden = false;
      message.textContent =
        '💗 Recovery verified! Choose your new password.';
    }

    // Supabase fires this event when a valid
    // password recovery link establishes a session.
    const { data: { subscription } } =
      supabase.auth.onAuthStateChange(event => {
        if (event === 'PASSWORD_RECOVERY') {
          unlock();
        }
      });

    async function verifyRecovery() {
      try {
        if (
          query.has('error') ||
          hash.has('error')
        ) {
          throw new Error('Invalid recovery link');
        }

        const tokenHash = query.get('token_hash');
        const code = query.get('code');
        const isRecovery =
          query.get('type') === 'recovery' ||
          hash.get('type') === 'recovery';

        if (tokenHash && isRecovery) {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
          });
          if (error) throw error;
          unlock();
        } else if (code) {
          // Supabase JS handles the code exchange
          // automatically when detectSessionInUrl is true.
          const { data, error } =
            await supabase.auth.getSession();

          if (error) throw error;

          if (recoveryVerified && data.session) {
            unlock();
          }
        } else if (
          hash.get('access_token') &&
          hash.get('refresh_token') &&
          isRecovery
        ) {
          const { data, error } =
            await supabase.auth.getSession();

          if (error) throw error;

          if (data.session) unlock();
        }

        // Give the auth recovery event time to arrive
        // before showing a missing-link message.
        if (!recoveryVerified) {
          message.textContent =
            '🔐 This page requires a valid recovery link. ' +
            'Please request a new one from your email.';
        }
      } catch (error) {
        console.error('TBB recovery verification:', error);
        form.hidden = true;
        recoveryVerified = false;
        message.textContent =
          '❌ Your recovery link is invalid or expired. ' +
          'Please request a new one.';
      }
    }

    await verifyRecovery();

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (!recoveryVerified || completed) return;

      const password =
        document.getElementById('password').value;
      const confirm =
        document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        message.textContent =
          '💋 Those passwords do not match, Baddie!';
        return;
      }

      button.disabled = true;
      message.textContent =
        '🔐 Updating your TBB password...';

      try {
        const { error } =
          await supabase.auth.updateUser({ password });

        if (error) throw error;

        completed = true;
        form.hidden = true;
        message.textContent =
          '🎉 Password successfully updated! ' +
          'You can now sign in with your new password.';

        subscription.unsubscribe();
        await supabase.auth.signOut();

        // Remove recovery tokens from the URL.
        history.replaceState(
          null,
          '',
          location.pathname
        );
      } catch (error) {
        console.error('TBB password update:', error);
        message.textContent =
          '❌ Password update failed. ' +
          'Please try again or request a new recovery link.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
