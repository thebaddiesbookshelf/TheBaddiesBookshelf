<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baddie Login</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="panel"><h1>💋 Baddie Login</h1><p>Welcome back to The Baddies Bookshelf.</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign In</button></form><p id="message" role="status"></p><nav><a href="register.html">Join the Baddies</a><a href="reset.html">Forgot password?</a><a href="home.html">Back to home</a></nav></main><script type="module">import {db,message,route,$} from './js/auth.js';$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message(error.message,true);else await route();b.disabled=false;};</script></body></html>
