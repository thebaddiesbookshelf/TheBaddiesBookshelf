<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="panel"><h1>💌 Reset Your Password</h1><form id="form"><label for="email">Account email</label><input id="email" type="email" required><button type="submit">Send Reset Link</button></form><p id="message" role="status"></p><nav><a href="login.html">Back to login</a></nav></main><script type="module">import {db,message,$} from './js/auth.js';$('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:new URL('update-password.html',location.href).href});message(error?error.message:'If the account exists, a reset email will arrive shortly.',!!error);};</script></body></html>
