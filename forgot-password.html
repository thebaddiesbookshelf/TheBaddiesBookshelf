
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | The Baddies Bookshelf</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme:dark;
      --pink:#ff39b0;
      --bg:#100913;
      --muted:#c5afc2;
    }
    * {box-sizing:border-box}
    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(ellipse at 20% 10%,#542044,transparent 40%),
        radial-gradient(ellipse at 90% 90%,#3e1540,transparent 40%),
        var(--bg);
      color:white;
      font-family:'DM Sans',sans-serif;
    }
    header {
      padding:20px clamp(20px,6vw,90px);
      border-bottom:1px solid #ffffff18;
    }
    header a {
      color:white;
      text-decoration:none;
      font-family:'Bebas Neue',sans-serif;
      font-size:27px;
    }
    header span {color:var(--pink)}
    main {
      min-height:calc(100vh - 85px);
      display:grid;
      place-items:center;
      padding:30px 16px;
    }
    .card {
      width:min(100%,500px);
      padding:clamp(24px,5vw,42px);
      background:#1b1021;
      border:1px solid #f787d05c;
      border-radius:26px;
      box-shadow:0 20px 75px #0008;
      text-align:center;
    }
    .kicker {
      color:var(--pink);
      letter-spacing:3px;
      font-size:12px;
      font-weight:800;
    }
    h1 {
      font:700 clamp(30px,6vw,43px) 'Playfair Display',serif;
    }
    h1 em {color:var(--pink);font-style:normal}
    p {color:var(--muted);line-height:1.7}
    label {
      display:block;
      text-align:left;
      margin:24px 0 8px;
      font-weight:700;
    }
    input {
      width:100%;
      padding:15px;
      background:#120b17;
      border:1px solid #76516f;
      border-radius:12px;
      color:white;
      font:inherit;
    }
    input:focus {
      outline:2px solid var(--pink);
      outline-offset:2px;
    }
    button {
      width:100%;
      padding:15px;
      margin-top:18px;
      border:0;
      border-radius:12px;
      background:linear-gradient(110deg,#ff229e,#f35bbb);
      color:white;
      font:800 15px 'DM Sans',sans-serif;
      cursor:pointer;
    }
    button:disabled {opacity:.6}
    #message {margin-top:20px;line-height:1.6}
    .links {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px 24px;
      margin-top:28px;
    }
    a {color:#ff90d0;font-weight:700}
  </style>
</head>
<body>
  <header>
    <a href="home.html">
      THE BADDIES <span>BOOKSHELF</span> ♕
    </a>
  </header>

  <main>
    <section class="card">
      <div class="kicker">✦ BADDIE ACCOUNT RECOVERY ✦</div>
      <h1>Forgot Your <em>Password?</em> 💋</h1>
      <p>
        Lost your way back to the bookshelf?
        Don't worry, Baddie. We'll send you a
        secure link to create a new password.
      </p>

      <form id="forgotForm">
        <label for="email">Your TBB Email Address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="baddie@example.com"
          required
        >
        <button id="sendButton" type="submit">
          💌 Send My Reset Link
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>

      <div class="links">
        <a href="home.html">🏠 TBB Home</a>
        <a href="login.html">🔐 Member Login</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://rmfmdetdykwfxxfzamhj.supabase.co',
      'sb_publishable_6UBKZvkvkyPNACqDDNRjNQ_wlgy-Jr2'
    );

    const form = document.getElementById('forgotForm');
    const emailInput = document.getElementById('email');
    const button = document.getElementById('sendButton');
    const message = document.getElementById('message');

    const params = new URLSearchParams(location.search);
    emailInput.value = params.get('email') || '';

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '💌 Sending your recovery email...';

      try {
        const redirectTo =
          new URL('reset-password.html', location.href).href;

        const { error } =
          await supabase.auth.resetPasswordForEmail(
            emailInput.value.trim(),
            { redirectTo }
          );

        if (error) throw error;

        message.textContent =
          '💗 If this email belongs to a TBB account, ' +
          'a reset link will be sent. Check your inbox ' +
          'and spam folder.';
      } catch (error) {
        console.error('TBB recovery request:', error);
        message.textContent =
          '❌ Unable to send your reset request. ' +
          'Please try again shortly.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
