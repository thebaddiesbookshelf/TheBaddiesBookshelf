<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="panel"><h1>💗 Choose a New Password</h1><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update Password</button></form><p id="message" role="status"></p><nav><a href="login.html">Sign in</a></nav></main><script type="module">import {db,message,$} from './js/auth.js';$('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:$('password').value});message(error?error.message:'Password updated. You can now sign in.',!!error);};</script></body></html>
