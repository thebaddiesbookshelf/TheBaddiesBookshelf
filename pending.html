<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Status</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="panel"><h1>💌 Your Baddie Application</h1><p id="status">Checking your status…</p><p id="message" role="status"></p><button id="refresh">Check Again</button> <button id="logout">Sign Out</button></main><script type="module">import {getAccess,route,logout,$,message} from './js/auth.js';async function check(){try{const a=await getAccess();if(!a.user||a.status==='approved')return route();$('status').textContent=({pending:'Your membership is awaiting admin approval.',rejected:'Your membership request was not approved.',suspended:'Your membership is currently suspended.'})[a.status]||'Your membership status is unavailable.';}catch(e){message(e.message,true);}}$('refresh').onclick=check;$('logout').onclick=logout;check();</script></body></html>
