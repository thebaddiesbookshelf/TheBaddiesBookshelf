<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baddie Admin HQ</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="panel"><h1>👑 Baddie Admin HQ</h1><p>Approve or reject pending membership requests.</p><p id="message" role="status"></p><section id="requests" aria-live="polite">Loading…</section><button id="refresh">Refresh Requests</button> <button id="logout">Sign Out</button><nav><a href="home.html">Public home</a></nav></main><script type="module">import {db,requireAccess,logout,$,message} from './js/auth.js';async function load(){try{const a=await requireAccess(true);if(!a)return;const {data,error}=await db.from('tbb_memberships').select('user_id,status,created_at').eq('status','pending').order('created_at',{ascending:true});if(error)throw error;const wrap=$('requests');wrap.replaceChildren();if(!data.length){wrap.textContent='No pending Baddies right now!';return;}for(const member of data){const div=document.createElement('div');div.className='item';const {data:profile}=await db.from('tbb_profiles').select('display_name,username').eq('user_id',member.user_id).maybeSingle();const name=document.createElement('strong');name.textContent=profile?.display_name||'New Baddie';div.append(name);const info=document.createElement('p');info.className='muted';info.textContent=`@${profile?.username||'username not set'} · Applied ${new Date(member.created_at).toLocaleDateString()}`;div.append(info);for(const [label,status] of [['Approve','approved'],['Reject','rejected']]){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{if(!confirm(`${label} this membership?`))return;button.disabled=true;const {error}=await db.from('tbb_memberships').update({status,approved_by:a.user.id,approved_at:status==='approved'?new Date().toISOString():null}).eq('user_id',member.user_id).eq('status','pending');if(error)message(error.message,true);else{message(`Membership ${status}.`);await load();}button.disabled=false;};div.append(button);}wrap.append(div);}}catch(e){message(e.message,true);}}$('refresh').onclick=load;$('logout').onclick=logout;load();</script></body></html>
