<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the Baddies</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="panel"><h1>🎀 Join the Baddies</h1><p>Register now. An admin must approve your membership before you can enter.</p><form id="form"><label for="name">Display name</label><input id="name" maxlength="80" required><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (at least 8 characters)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Request Membership</button></form><p id="message" role="status"></p><nav><a href="login.html">Already a Baddie? Sign in</a></nav></main><script type="module">import {db,message,$} from './js/auth.js';$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const {error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{display_name:$('name').value.trim()},emailRedirectTo:new URL('login.html',location.href).href}});message(error?error.message:'Request received! Check your email for a confirmation link if required, then sign in to see your approval status.',!!error);b.disabled=false;};</script></body></html>
